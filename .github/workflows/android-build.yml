name: Build Textbook Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and .env
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          touch .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Textbook Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Textbook-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

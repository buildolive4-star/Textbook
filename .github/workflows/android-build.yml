name: Build Textbook Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK 36.1 & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if [ "${trimmed#\{}" != "$trimmed" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
            echo "Wrote app/google-services.json from GitHub Secret."
          elif [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json from repository."
          else
            echo "::error::Missing app/google-services.json. Add the GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Configure debug.keystore and .env
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            if printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null \
              && keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
              echo "Decoded and verified debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret could not be verified; falling back to repository keystore."
              rm -f debug.keystore
            fi
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Decoded debug.keystore from repository debug.keystore.base64."
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore."
          fi
          touch .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-configuration-cache --console=plain

      - name: Upload Textbook Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Textbook-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
